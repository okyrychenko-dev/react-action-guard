name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changeset:
    name: Changeset check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Require a changeset for package changes
        run: pnpm exec changeset status --since=origin/main

  publication:
    name: Packed publication checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run package:check
      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-results
          path: |
            /tmp/action-guard-publication-*/publication.json
            /tmp/action-guard-publication-*/*-attw.json
            /tmp/action-guard-publication-*/consumer/package-lock.json
          if-no-files-found: ignore

  packed-compatibility:
    name: Packed compatibility (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          [
            react-18,
            react-19,
            react-19-floor,
            react-router-floor,
            react-router-7-floor,
            react-router-current,
            tanstack-router-floor,
            next-13-floor,
            next-14-floor,
            next-15-floor,
            next-current,
            query-floor,
          ]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test:packed ${{ matrix.target }}
      - name: Upload isolated consumer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packed-${{ matrix.target }}
          path: |
            /tmp/action-guard-compatibility-*/${{ matrix.target }}/result.json
            /tmp/action-guard-compatibility-*/${{ matrix.target }}/package-lock.json
          if-no-files-found: ignore

  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test:coverage

      - name: Install Chrome for navigation tests
        if: matrix.node == 22
        run: pnpm --filter @okyrychenko-dev/react-action-guard-router exec playwright install --with-deps chrome

      - name: Verify real browser back and forward
        if: matrix.node == 22
        timeout-minutes: 3
        run: pnpm --filter @okyrychenko-dev/react-action-guard-router test:browser

      - name: Upload browser verification results
        if: always() && matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: navigation-browser-results
          path: packages/router/.cache/browser-history
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Upload coverage
        if: matrix.node == 22
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
