name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  HUSKY: "0"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changeset:
    name: Changeset check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      CHANGESETS_VERSION_PR: >-
        ${{ github.event.pull_request.user.login == 'github-actions[bot]' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.head_ref == format('changeset-release/{0}', github.base_ref) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Require a changeset for package changes
        if: env.CHANGESETS_VERSION_PR != 'true'
        run: pnpm exec changeset status --since=origin/main

      - name: Changesets already applied in the version PR
        if: env.CHANGESETS_VERSION_PR == 'true'
        run: echo "The generated version PR has already consumed its changesets."

  verification:
    uses: ./.github/workflows/verification.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
